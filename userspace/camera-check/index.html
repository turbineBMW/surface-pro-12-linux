<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Check</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #111; --fg: #eee; --dim: #999; --accent: #4fa3ff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
  select, button { background: #222; color: var(--fg); border: 1px solid #444; border-radius: 6px; padding: 6px 10px; font: inherit; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 1fr); gap: 16px; padding: 0 16px 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .view { position: relative; }
  video { width: 100%; display: block; background: #000; border-radius: 8px; }
  #roi { position: absolute; border: 2px dashed var(--accent); pointer-events: none; display: none; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: 4px 6px; border-bottom: 1px solid #222; }
  td:first-child { color: var(--dim); }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; border: 1px solid #555; }
</style>
</head>
<body>
<header>
  <strong>Camera Check</strong>
  <select id="cam"></select>
  <select id="res">
    <option value="1920x1080">1920×1080</option>
    <option value="1280x720">1280×720</option>
  </select>
  <button id="start">Start</button>
  <button id="snap">Save frame</button>
  <span id="info" class="note"></span>
</header>
<main>
  <div class="view">
    <video id="v" autoplay playsinline muted></video>
    <div id="roi"></div>
  </div>
  <div>
    <table id="stats"></table>
    <p class="note">Drag on the picture to measure a region (e.g. a white wall or a face).
      Numbers are from the frames the browser decodes, as Meet, Teams and Zoom
      in Chromium would get them. Levels: 0–255 sRGB.</p>
  </div>
</main>
<canvas id="c" hidden></canvas>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), c = $('c'), ctx = c.getContext('2d', { willReadFrequently: true });
let roi = null, drag = null, stream = null;

async function listCams() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const sel = $('cam'), keep = sel.value;
  sel.innerHTML = '';
  for (const d of devs) sel.add(new Option(d.label || d.deviceId.slice(0, 8), d.deviceId));
  if (keep) sel.value = keep;
}

async function start() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const [w, h] = $('res').value.split('x').map(Number);
  const id = $('cam').value;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: id ? { exact: id } : undefined, width: { ideal: w }, height: { ideal: h } } });
  v.srcObject = stream;
  await listCams();
  const s = stream.getVideoTracks()[0].getSettings();
  $('info').textContent = `${s.width}×${s.height} @ ${Math.round(s.frameRate || 0)} fps · ${stream.getVideoTracks()[0].label}`;
  try { localStorage.setItem('cam', s.deviceId); } catch (e) {}
}

function pct(sorted, q) { return sorted[Math.min(sorted.length - 1, Math.floor(q / 100 * sorted.length))]; }

function measure() {
  if (!v.videoWidth) return;
  const W = 480, H = Math.round(480 * v.videoHeight / v.videoWidth);
  c.width = W; c.height = H;
  ctx.drawImage(v, 0, 0, W, H);
  const all = ctx.getImageData(0, 0, W, H).data;
  const n = W * H, luma = new Uint8Array(n);
  let sat = 0, sumY = 0;
  for (let i = 0, p = 0; p < n; i += 4, p++) {
    const r = all[i], g = all[i + 1], b = all[i + 2];
    const y = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
    luma[p] = y; sumY += y;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    sat += mx === mn ? 0 : (l < 128 ? (mx - mn) / (mx + mn) : (mx - mn) / (510 - mx - mn));
  }
  luma.sort();
  const rows = [
    ['Black level (1st pct)', pct(luma, 1)],
    ['0.1st pct', pct(luma, 0.1)],
    ['White level (99th pct)', pct(luma, 99)],
    ['Mean luma', (sumY / n).toFixed(1)],
    ['Saturation (HSL, 0–255)', (255 * sat / n).toFixed(1)],
  ];
  if (roi) {
    const x = Math.round(roi.x * W), y = Math.round(roi.y * H);
    const w = Math.max(1, Math.round(roi.w * W)), h = Math.max(1, Math.round(roi.h * H));
    const d = ctx.getImageData(x, y, w, h).data;
    let R = 0, G = 0, B = 0;
    for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; }
    const k = d.length / 4;
    R /= k; G /= k; B /= k;
    rows.push(['Region R,G,B', `<span class="swatch" style="background:rgb(${R|0},${G|0},${B|0})"></span>${R.toFixed(0)}, ${G.toFixed(0)}, ${B.toFixed(0)}`]);
    rows.push(['Region R/B (warmth)', (R / Math.max(B, 1)).toFixed(2)]);
  }
  $('stats').innerHTML = rows.map(([k, val]) => `<tr><td>${k}</td><td>${val}</td></tr>`).join('');
  window.cameraCheck = Object.fromEntries(rows.map(([k, val]) => [k, String(val).replace(/<[^>]+>/g, '')]));
}

const view = document.querySelector('.view');
function rel(e) { const r = v.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
view.addEventListener('pointerdown', e => { drag = rel(e); });
view.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = rel(e);
  roi = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) };
  const r = $('roi').style, vr = v.getBoundingClientRect();
  r.display = 'block'; r.left = roi.x * vr.width + 'px'; r.top = roi.y * vr.height + 'px';
  r.width = roi.w * vr.width + 'px'; r.height = roi.h * vr.height + 'px';
});
addEventListener('pointerup', () => { drag = null; });
window.setRegion = (x, y, w, h) => { roi = { x, y, w, h }; };

$('start').onclick = () => start().catch(e => $('info').textContent = e.message);
$('cam').onchange = $('res').onchange = () => start().catch(e => $('info').textContent = e.message);
$('snap').onclick = () => {
  const k = document.createElement('canvas'); k.width = v.videoWidth; k.height = v.videoHeight;
  k.getContext('2d').drawImage(v, 0, 0);
  const a = document.createElement('a'); a.download = `camera-check-${Date.now()}.png`; a.href = k.toDataURL('image/png'); a.click();
};
setInterval(measure, 500);
// Auto mode for scripted tests: index.html?auto=SECONDS&label=TEXT[&res=WxH]
// starts the first camera whose label contains TEXT and POSTs the numbers
// to /result once a second for SECONDS (serve.py prints them).
const q = new URLSearchParams(location.search);
listCams().then(async () => {
  try { const id = localStorage.getItem('cam'); if (id) $('cam').value = id; } catch (e) {}
  if (!q.has('auto')) return;
  if (q.get('res')) $('res').value = q.get('res');
  // Labels are only visible after a first permission grant.
  await navigator.mediaDevices.getUserMedia({ video: true }).then(s => s.getTracks().forEach(t => t.stop()));
  await listCams();
  const want = (q.get('label') || '').toLowerCase();
  const opt = [...$('cam').options].find(o => o.text.toLowerCase().includes(want));
  if (opt) $('cam').value = opt.value;
  await start();
  if (q.get('roi')) setRegion(...q.get('roi').split(',').map(Number));
  const until = Date.now() + 1000 * Number(q.get('auto'));
  const timer = setInterval(() => {
    fetch('/result', { method: 'POST', body: JSON.stringify({ t: Date.now(), track: $('info').textContent, cams: [...$('cam').options].map(o => o.text), ...window.cameraCheck }) });
    if (Date.now() > until) { clearInterval(timer); fetch('/result', { method: 'POST', body: '{"done":true}' }); }
  }, 1000);
}).catch(e => fetch('/result', { method: 'POST', body: JSON.stringify({ error: String(e) }) }));
</script>
</body>
</html>
