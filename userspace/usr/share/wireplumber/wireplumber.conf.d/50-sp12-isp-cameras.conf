# Surface Pro 12 (Intel): the hardware-ISP cameras (v4l2loopback devices fed
# by v4l2-relayd from the IPU7 PSYS) rank above the libcamera soft-ISP ones
# (front 800, back 750), so applications that take the default camera get the
# ISP picture. The soft-ISP nodes stay available for selection.
monitor.v4l2.rules = [
  {
    matches = [
      {
        node.name = "~v4l2_input.*"
        api.v4l2.cap.card = "Surface Front Camera ISP"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
        node.description = "Surface Front Camera (ISP)"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~v4l2_input.*"
        api.v4l2.cap.card = "Surface Rear Camera ISP"
      }
    ]
    actions = {
      update-props = {
        priority.session = 900
        node.description = "Surface Rear Camera (ISP)"
      }
    }
  }
]
