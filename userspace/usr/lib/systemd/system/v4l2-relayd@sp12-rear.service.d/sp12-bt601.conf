# Surface Pro 12 (Intel): the rear camera relay converts its colour matrix with
# sp12bt601 (sp12-autoframe) instead of the relay's videoconvert. The source
# pipeline comes from a second environment file, loaded after the relay's own
# so its values win; removing the package leaves the plain relay.
[Service]
EnvironmentFile=-/etc/v4l2-relayd.d/sp12-rear-bt601.env
