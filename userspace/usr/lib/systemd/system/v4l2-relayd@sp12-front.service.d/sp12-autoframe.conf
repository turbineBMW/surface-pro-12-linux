# Surface Pro 12 (Intel): automatic framing (sp12-autoframe) in the front
# camera relay. The element's source pipeline comes from a second environment
# file, loaded after the relay's own so its VIDEOSRC wins; removing the
# package leaves the plain relay.
[Service]
EnvironmentFile=-/etc/v4l2-relayd.d/sp12-front-autoframe.conf
# The face detector runs on the NPU, an accel-class node, which the base
# unit's DevicePolicy=closed list (drm, media, video4linux, psys) lacks.
DeviceAllow=char-accel rw
DeviceAllow=/dev/accel/accel0 rw
