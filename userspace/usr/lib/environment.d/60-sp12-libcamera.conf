# Surface Pro 12 (Intel): use libcamera's CPU software ISP. The one-pass GPU
# ISP (libcamera 0.7.2) aliases the IMX681's Bayer mosaic when downscaling
# to some sizes, 1920x1080 among them: a fine grid and a magenta cast. The
# CPU path is clean at every size and costs ~5% more of one core at 1080p30.
# Drop this once libcamera's multi-pass GPU ISP is released.
LIBCAMERA_SOFTISP_MODE=cpu
