# Surface Pro 12 (Intel) OLED PSR. The driver default is PSR2 (selective
# update). With it the panel sometimes pulses very faintly on a mostly still
# screen; Windows doesn't. PSR1 removes it: uncomment the line below.
# psr_safest_params=1 doesn't help: PSR2 doesn't fit the safest wake-line
# timing and the driver falls back to PSR1. Windows' sink config (DPCD 0x170
# = 0x65, adds CRC verification) made no visible difference in a live test.
# Left at the default PSR2 for now, to find when the pulse shows up.
# xe loads from the initramfs; the 90-sp12-display-initramfs pacman hook
# rebuilds the UKI when this file changes.
#options xe enable_psr=1
