# Surface Pro 12 (Intel) OLED: with the default PSR2 (selective update)
# parameters the panel pulses faintly on a mostly still screen; Windows
# doesn't. PSR1 removes it. psr_safest_params=1 was tried to keep PSR2, but
# with the safest wake-line timing PSR2 doesn't fit and the driver falls back
# to PSR1 (i915_edp_psr_status: "PSR1 enabled"), so say PSR1 directly.
# xe loads from the initramfs: rebuild it (limine-mkinitcpio) after changing
# this.
options xe enable_psr=1
