# Surface Pro 12 (Intel) OLED: with the default PSR2 (selective update)
# parameters the panel pulses faintly on a mostly still screen; Windows
# doesn't. PSR1 (enable_psr=1) removes it. Trying PSR2 with the driver's
# safest wake-line/timing parameters first; if it still pulses, go back to
# enable_psr=1. xe loads from the initramfs: rebuild it (limine-mkinitcpio)
# after changing this.
options xe psr_safest_params=1
