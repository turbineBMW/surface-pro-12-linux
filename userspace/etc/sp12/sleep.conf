# Read by /usr/lib/systemd/system-sleep/sp12-sleep-log at every suspend.
# EC_WAKE_LID_CLOSED: "no" turns the EC's wake line off while the lid is
#   closed (the attached keyboard cannot wake the system then; lid-open and
#   the power button still do); "yes" leaves it on.
# TRACE_EC_EVENTS: "yes" names the EC events received at each resume in the
#   sp12-sleep journal line.
EC_WAKE_LID_CLOSED=no
TRACE_EC_EVENTS=yes
