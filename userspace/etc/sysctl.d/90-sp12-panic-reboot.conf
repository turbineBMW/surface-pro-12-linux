# Reboot 60 s after a kernel panic instead of sitting on it until the battery
# is flat. The dead batteries of 2026-11-05 and 2026-11-07 were a panic in the
# Surface Serial Hub UART's DMA teardown at suspend (docs/peripheral-plan.md,
# Phase 4); with efi-pstore on (efi_pstore.pstore_disable=0) the panic log is
# in /sys/fs/pstore after the reboot.
kernel.panic = 60
