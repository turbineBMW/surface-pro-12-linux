# One loopback device per hardware-ISP camera (v4l2-relayd feeds them).
# exclusive_caps makes them plain capture devices to applications.
# (array parameter: one quoted string, elements separated by commas)
#
# video_nr keeps the loopbacks clear of the ISYS nodes. v4l2loopback and the
# IPU7 ISYS load about half a second apart with no ordering between them, so
# without fixed numbers the ISYS capture nodes start at video0 or video2
# depending on which wins. Pinned here, ISYS Capture N is always /dev/videoN on
# 7.4, and the IR camera (Capture 8) is always /dev/video8. Facelock 0.3.0
# needs that: its IR quirk matches sysfs identity and does not follow the
# /dev/sp12-ir symlink. Relays find the loopbacks by card_label, not number.
options v4l2loopback devices=2 video_nr=40,41 exclusive_caps=1,1 card_label="Surface Front Camera ISP,Surface Rear Camera ISP"
