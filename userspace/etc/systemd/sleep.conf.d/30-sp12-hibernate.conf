# Lid close and idle use suspend-then-hibernate (logind.conf.d/30-sp12-lid.conf
# and the idle plugin): s2idle as before, and after 12 h closed on battery the
# system hibernates instead of sleeping on. Resume from disk was verified on
# 2026-11-08 (12 GB image, LUKS, Limine UKI, about 90 s), and since kernel
# patch 0035 the IPU re-authenticates its firmware at restore, so the cameras
# survive it. s2idle costs ~0.3 W, so 12 h is about 6 %; a night stays s2idle
# and wakes instantly, a day or more closed comes back from disk. On the
# charger it only suspends.
[Sleep]
HibernateDelaySec=12h
HibernateOnACPower=no
