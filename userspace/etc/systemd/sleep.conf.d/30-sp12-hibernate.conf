# Lid close and idle use suspend-then-hibernate (logind.conf.d/30-sp12-lid.conf
# and the idle plugin): s2idle as before, and after 48 h closed on battery the
# system hibernates instead of sleeping on. Resume from disk was verified on
# 2026-11-08 (12 GB image, LUKS, Limine UKI), but the IPU's ISYS firmware does
# not come back after a hibernate (fw boot timeout) and the IPU cannot be
# re-probed (ipu-bridge keeps its software nodes), so the cameras need a
# reboot afterwards. Hence 48 h: a forgotten multi-day close is saved (s2idle
# costs ~0.3 W, 48 h is about 25 %), a day or a night is never touched. On the
# charger it only suspends.
[Sleep]
HibernateDelaySec=48h
HibernateOnACPower=no
