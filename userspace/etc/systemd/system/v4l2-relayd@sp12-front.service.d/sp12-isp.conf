# Surface Pro 12 (Intel): relay instance settings for the hardware-ISP
# cameras (sp12-camera-hal). The base unit runs as root with no capabilities.
[Unit]
# Started by udev when the PSYS device appears (70-sp12-psys.rules). Without
# the device (a kernel without the PSYS driver) the HAL finds no cameras, the
# relay's pipeline fails and clients of the loopback device hang, so never
# start without it.
ConditionPathExists=/dev/ipu7-psys0

[Service]
# The HAL keeps a SysV shared-memory segment (key 0x0043414d, mode 640, owned
# by whoever created it first, tracking which pid has each camera open). If a
# user session created it, the relay needs CAP_IPC_OWNER to attach. When a
# relay stops it marks the segment for removal: the other camera's relay
# keeps its mapping and later users get a fresh one.
CapabilityBoundingSet=CAP_IPC_OWNER
ExecStopPost=-/usr/bin/ipcrm -M 0x0043414d
# Own GStreamer registry (private /tmp): a plugin that once failed to load
# stays blacklisted in a cached registry until its file changes.
Environment=GST_REGISTRY=/tmp/gst-registry.bin
# HAL errors and warnings to the journal.
Environment=cameraDebug=0x1
