# Surface Pro 12 (Intel): relay instance settings for the hardware-ISP
# cameras (sp12-camera-hal). The base unit runs as root with no capabilities.
[Unit]
# Started by udev when the PSYS device appears (70-sp12-psys.rules). Without
# the device (a kernel without the PSYS driver) the HAL finds no cameras, the
# relay's pipeline fails and clients of the loopback device hang, so never
# start without it.
ConditionPathExists=/dev/ipu7-psys0

[Service]
# The HAL keeps a SysV shared-memory segment (key 0x0043414d, mode 640, owned
# by whoever created it first, tracking which pid has each camera open). If a
# user session created it, the relay needs CAP_IPC_OWNER to attach. When a
# relay stops it marks the segment for removal: the other camera's relay
# keeps its mapping and later users get a fresh one.
CapabilityBoundingSet=CAP_IPC_OWNER
ExecStopPost=-/usr/bin/ipcrm -M 0x0043414d
# Own GStreamer registry (private /tmp): a plugin that once failed to load
# stays blacklisted in a cached registry until its file changes.
Environment=GST_REGISTRY=/tmp/gst-registry.bin
# HAL errors and warnings to the journal. cameraDebug replaces the HAL's
# default mask (ERR|WARNING|INFO = 0x70) and its bits are ERR 0x40, WARNING
# 0x20, INFO 0x10, LV3-LV1 0x4-0x1. 0x1 would be LV1 debug only: ~1,200
# journal lines a second while streaming, and no errors.
Environment=cameraDebug=0x60
# PipeWire makes a camera source only if the loopback offers capture when it
# probes it; announce the device again once the relay feeds it. Outside the
# sandbox ("+"): /sys is read-only in the unit.
ExecStartPost=-+/usr/lib/sp12/v4l2-relay-announce
# Omarchy's v4l2-relayd (0.2.0, 0001-reset-output-on-idle.patch) restarts the
# output pipeline when the last client leaves after more than 3 s. v4l2sink
# then streams off, and with exclusive_caps the loopback offers capture again
# only once a frame reaches it. The splash frames meant to do that are
# timestamped from 0 while the output clock has run on, so a v4l2sink that
# syncs to the clock drops them as late unless it is still prerolling: a race
# that left the camera unopenable until the relay restarted. The relay only
# forwards frames, so render them on arrival. The base unit's command with
# sync=false on v4l2sink; keep it in step with /usr/lib/systemd/system/
# v4l2-relayd@.service.
ExecStart=
ExecStart=/bin/sh -c 'DEVICE=$(grep -l -m1 -E "^${CARD_LABEL}$" /sys/devices/virtual/video4linux/*/name | cut -d/ -f6); exec /usr/bin/v4l2-relayd -i "${VIDEOSRC}" $${SPLASHSRC:+-s "$${SPLASHSRC}"} -o "appsrc name=appsrc caps=video/x-raw,format=${FORMAT},width=${WIDTH},height=${HEIGHT},framerate=${FRAMERATE} ! videoconvert ! v4l2sink name=v4l2sink sync=false device=/dev/$${DEVICE}" $EXTRA_OPTS'
