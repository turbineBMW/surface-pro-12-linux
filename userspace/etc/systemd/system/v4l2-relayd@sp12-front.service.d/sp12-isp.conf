# Dev staging: Intel's camera HAL, icamerasrc and the IPU7.5 closed libraries
# from the dev prefix under /home. The relay unit runs as root with no
# capabilities, which cannot traverse a 0700 home directory, so it gets
# CAP_DAC_READ_SEARCH here. The HAL keeps a SysV shared-memory segment (key
# 0x0043414d, mode 640, owned by whoever created it first); CAP_IPC_OWNER lets
# the relay attach when a user session made it. The package will install to
# /usr and may still need the IPC part. Drop this
# file.
[Service]
# The base unit makes /home inaccessible; the dev prefix lives there.
InaccessiblePaths=
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_IPC_OWNER
Environment=GST_PLUGIN_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/lib/gstreamer-1.0
Environment=LD_LIBRARY_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/lib
Environment=CAMERA_CFG_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/etc/camera/ipu75xa/
# Own GStreamer registry (private /tmp): a plugin that once failed to load
# stays blacklisted in a cached registry until its file changes.
Environment=GST_REGISTRY=/tmp/gst-registry.bin
# HAL errors and warnings to the journal while this is a dev install.
Environment=cameraDebug=0x1
