# Surface Pro 12 (Intel): the front camera relay with automatic framing
# (sp12-autoframe). Loaded after sp12-front.conf by the relay unit drop-in,
# so this VIDEOSRC replaces that one: 3840x2160 from the ISP, the
# sp12autoframe element crops a window that follows the face(s) and scales it
# to the relay's 1920x1080. `sp12-autoframe off` shows the whole field of
# view; settings live in /run/sp12/autoframe.
VIDEOSRC="icamerasrc device-name=imx681-uf ! video/x-raw,format=NV12,width=3840,height=2160,framerate=30/1 ! sp12autoframe model=/usr/share/sp12/face_detection_yunet_2023mar.onnx control-file=/run/sp12/autoframe ! video/x-raw,format=NV12,width=1920,height=1080 ! videoconvert"
