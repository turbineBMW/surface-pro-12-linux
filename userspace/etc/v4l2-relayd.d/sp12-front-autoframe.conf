# Surface Pro 12 (Intel): the front camera relay with automatic framing
# (sp12-autoframe). Loaded after sp12-front.conf by the relay unit drop-in,
# so this VIDEOSRC replaces that one. ISP mode: the relay takes 1080p from the
# ISP as before; the sp12autoframe element only detects faces and sends the
# window upstream as icamerasrc's zoom-region, and the ISP crops and scales it
# (sp12-camera-hal 2025.12.10-4 or later). `sp12-autoframe off` shows the
# whole field of view; settings live in /run/sp12/autoframe.
VIDEOSRC="icamerasrc device-name=imx681-uf ! video/x-raw,format=NV12,width=1920,height=1080,framerate=30/1 ! sp12autoframe mode=isp model=/usr/share/sp12/face_detection_yunet_2023mar.onnx control-file=/run/sp12/autoframe ! video/x-raw,format=NV12,width=1920,height=1080 ! videoconvert"
