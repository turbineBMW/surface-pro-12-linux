# Surface Pro 12 (Intel): the rear camera (OV13858) through the IPU7 hardware
# ISP, Intel's camera HAL and icamerasrc, relayed on demand into a v4l2loopback
# device. v4l2-relayd keeps the camera closed until a client streams from the
# loopback device and closes it when the last client stops. Browsers get it
# through PipeWire; native apps open the loopback node directly.
# (The description must end in an element, not caps: a trailing "! caps" is a
# parse error, "link has no sink".)
VIDEOSRC="icamerasrc device-name=ov13858-wf ! video/x-raw,format=NV12,width=1920,height=1080,framerate=30/1 ! videoconvert"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
# Must match card_label in modprobe.d/sp12-v4l2loopback.conf. The relay unit
# matches it as an extended regex, so no ( ) or other metacharacters.
CARD_LABEL="Surface Rear Camera ISP"


