# Dev only (isp/install-relay-dev.sh): point the relay at the HAL in the dev
# prefix under /home instead of the sp12-camera-hal package. Installed as
# zz-dev-prefix.conf after the packaged drop-in. The base unit makes /home
# inaccessible and the relay has no capabilities, so it also gets
# CAP_DAC_READ_SEARCH to traverse a 0700 home directory.
[Service]
InaccessiblePaths=
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
Environment=GST_PLUGIN_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/lib/gstreamer-1.0
Environment=LD_LIBRARY_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/lib
Environment=CAMERA_CFG_PATH=/home/turbinebmw/Projects/surface-pro-12-linux/private/camera/psys/work/prefix/etc/camera/ipu75xa/
