PACKAGE_NAME="sp12-modules"
PACKAGE_VERSION="1.1"

# Surface Pro 12 (Intel): SSAM registry, POS tablet switch, lid wake GPE and
# Bluetooth LE legacy OOB pairing (for the Flex Keyboard). Sources for the
# kernel being built come from cache/ or are fetched (see prepare-sources.sh).
PRE_BUILD="prepare-sources.sh ${kernelver}"
MAKE[0]="make KVER=${kernelver}"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="surface_aggregator_registry"
BUILT_MODULE_LOCATION[0]="surface/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[1]="surface_aggregator_tabletsw"
BUILT_MODULE_LOCATION[1]="surface/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[2]="surface_gpe"
BUILT_MODULE_LOCATION[2]="surface/"
DEST_MODULE_LOCATION[2]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[3]="bluetooth"
BUILT_MODULE_LOCATION[3]="bluetooth/"
DEST_MODULE_LOCATION[3]="/kernel/net/bluetooth/"
