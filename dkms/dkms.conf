PACKAGE_NAME="sp12-modules"
PACKAGE_VERSION="1.14"

# Surface Pro 12 (Intel): SSAM registry, POS tablet switch, lid wake GPE,
# Bluetooth LE legacy OOB pairing (for the Flex Keyboard), chassis buttons
# (soc_button_array probe order), the PN560 NFC controller, a fix for a
# POS posture event storm, and the rear (OV13858), front (IMX681) and IR
# (VD55G0) cameras (including IPU7 ISYS snooped frame writes), and a
# battery charge limit, and battery events kept off over suspend so the
# keyboard can wake it; Bluetooth keeps wake-capable links over suspend.
# Sources for the kernel being built come from cache/ or are fetched (see
# prepare-sources.sh).
PRE_BUILD="prepare-sources.sh ${kernelver}"
MAKE[0]="make KVER=${kernelver}"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="surface_aggregator_registry"
BUILT_MODULE_LOCATION[0]="surface/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[1]="surface_aggregator_tabletsw"
BUILT_MODULE_LOCATION[1]="surface/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[2]="surface_gpe"
BUILT_MODULE_LOCATION[2]="surface/"
DEST_MODULE_LOCATION[2]="/kernel/drivers/platform/surface/"
BUILT_MODULE_NAME[3]="bluetooth"
BUILT_MODULE_LOCATION[3]="bluetooth/"
DEST_MODULE_LOCATION[3]="/kernel/net/bluetooth/"
BUILT_MODULE_NAME[4]="soc_button_array"
BUILT_MODULE_LOCATION[4]="input/"
DEST_MODULE_LOCATION[4]="/kernel/drivers/input/misc/"
BUILT_MODULE_NAME[5]="nxp-nci_i2c"
BUILT_MODULE_LOCATION[5]="nfc/"
DEST_MODULE_LOCATION[5]="/kernel/drivers/nfc/nxp-nci/"
BUILT_MODULE_NAME[6]="ov13858"
BUILT_MODULE_LOCATION[6]="media/"
DEST_MODULE_LOCATION[6]="/kernel/drivers/media/i2c/"
BUILT_MODULE_NAME[7]="imx681"
BUILT_MODULE_LOCATION[7]="media/"
DEST_MODULE_LOCATION[7]="/kernel/drivers/media/i2c/"
BUILT_MODULE_NAME[8]="ipu-bridge"
BUILT_MODULE_LOCATION[8]="bridge/"
DEST_MODULE_LOCATION[8]="/kernel/drivers/media/pci/intel/"
BUILT_MODULE_NAME[9]="intel-ipu7-isys"
BUILT_MODULE_LOCATION[9]="ipu7/"
DEST_MODULE_LOCATION[9]="/kernel/drivers/staging/media/ipu7/"
BUILT_MODULE_NAME[10]="vd55g1"
BUILT_MODULE_LOCATION[10]="media/"
DEST_MODULE_LOCATION[10]="/kernel/drivers/media/i2c/"
BUILT_MODULE_NAME[11]="surface_battery"
BUILT_MODULE_LOCATION[11]="power/"
DEST_MODULE_LOCATION[11]="/kernel/drivers/power/supply/"
BUILT_MODULE_NAME[12]="surface_charger"
BUILT_MODULE_LOCATION[12]="power/"
DEST_MODULE_LOCATION[12]="/kernel/drivers/power/supply/"
